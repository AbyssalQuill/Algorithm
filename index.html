<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <!-- 手机上固定为设备宽度：不缩放、不横向晃动；viewport-fit=cover 让安装成应用后内容铺到刘海 / 圆角区域 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>算法笔记本 · 从零基础到算法竞赛</title>
    <meta name="description" content="从第一行代码开始，用动画和逐行高亮的代码，一步步学会 C / C++ / Python / Java、数据结构与算法，为算法竞赛打好基础。" />
    <!-- 状态栏的颜色跟着页面纸张的颜色走（暗色主题时由脚本改成黑板色），安装成应用后顶部就没有黑色的栏 -->
    <meta name="theme-color" content="#f8f5ee" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="算法笔记本" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <script>
      try {
        var t = localStorage.getItem('theme')
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1b2321')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
